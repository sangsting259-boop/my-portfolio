<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trần Thanh Sang - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Nền không gian huyền ảo & các khối sáng -->
    <div class="background-wrapper">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
        <canvas id="particles-canvas"></canvas>
    </div>

    <main class="container">
        <section class="glass-card profile-card" id="tilt-card">
            <div class="avatar-container">
                <!-- Thay link ảnh thật của bạn vào src nếu muốn, hiện tại dùng avatar chữ hoặc ảnh mặc định -->
                <div class="avatar-placeholder">TS</div>
            </div>
            <h1>TRẦN THANH SANG</h1>
            <p class="subtitle">Newbie Developer | Enthusiast in Web & Game Dev</p>
            <p class="bio">Chào mừng đến với trang Portfolio của tôi. Tôi đang tìm hiểu về Web & Game Dev với Unity.</p>
            
            <div class="social-links">
                <a href="https://github.com/sangsting259-boop" target="_blank" class="btn">Ghé thăm GitHub</a>
            </div>
        </section>
    </main>

    <!-- JavaScript tạo hiệu ứng 3D Card & Mưa hạt ánh sáng tương tác chuột -->
    <script>
        // 1. Hiệu ứng nghiêng 3D cho Thẻ Glassmorphism
        const card = document.getElementById('tilt-card');
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            // Xoay thẻ theo tọa độ chuột
            card.style.transform = `rotateX(${-y / 15}deg) rotateY(${x / 15}deg) translateY(-5px)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg) translateY(0px)`;
        });

        // 2. Hiệu ứng hạt ánh sáng lung linh canvas
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const mouse = { x: null, y: null, radius: 150 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                this.color = Math.random() > 0.5 ? '#3b82f6' : '#ec4899';
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                if (distance < mouse.radius) {
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 10;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 10;
                    }
                }
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].draw();
                particlesArray[i].update();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
